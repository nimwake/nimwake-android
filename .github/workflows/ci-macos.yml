# macOS — 개발 머신 스크립트가 macOS(BSD)에서도 같은 명령으로 도는지 (D-A7)
#
# macOS runner는 배정이 15분 넘게 밀릴 때가 있다 (2026-10-09, #8). 그래서 항상 돌리지 않는다.
#   - 기기에서만 도는 코드(guest/, host/boot/)와 문서만 바뀐 PR은 건너뛴다
#   - 매주 한 번 돌려 runner 이미지 변화로 생긴 차이를 잡는다
#   - 실패는 숨기지 않고 실패로 보인다. 머지를 막는 필수 체크로 두지 않는다
#
# host/lib · host/bin은 기기 코드지만 make test(bats)가 개발 머신에서 가짜 daemon으로 돌리므로 포함한다.

name: CI (macOS)

# paths-ignore 두 목록은 같아야 한다.
on:
  pull_request:
    paths-ignore:
      - ".docs/**"
      - "**/*.md"
      - "guest/**"
      - "host/boot/**"
      - "host/host.conf.example"
      - "core.lock"
      - "examples/**"
  push:
    branches: [main]
    paths-ignore:
      - ".docs/**"
      - "**/*.md"
      - "guest/**"
      - "host/boot/**"
      - "host/host.conf.example"
      - "core.lock"
      - "examples/**"
  schedule:
    - cron: "0 3 * * 1" # 월요일 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  check:
    name: lint / unit (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tools
        with:
          shellcheck-version: ${{ env.SHELLCHECK_VERSION }}

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test
