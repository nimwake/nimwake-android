# Pull Request — lint + 기기 없는 테스트 (Linux, 항상)
#
# 실기기 테스트(tests/device)는 CI에 넣지 않는다. 결과는 .docs/validation/ 리포트로 남긴다. (Phase 1 D-A6)
# macOS는 ci-macos.yml이 개발 머신 스크립트가 바뀔 때만 돌린다. BSD/GNU 차이의 대부분은
# 여기의 check-portability(make lint)와 original-awk 비교 테스트가 잡는다. (D-A7)

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  check:
    name: lint / unit (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tools
        with:
          shellcheck-version: ${{ env.SHELLCHECK_VERSION }}

      # git이 실행 비트를 잃으면 기기에서 Permission denied가 난다. (validation/02 작업 중 실제로 겪었다)
      - name: Executable bits
        run: |
          missing=0
          for f in $(git ls-files '*.sh' 'host/bin/*' 'host/boot/*' 'host/ingress/*' 'tests/unit/fixtures/*'); do
            case "$f" in host/lib/*) continue ;; esac
            if [ ! -x "$f" ]; then
              echo "::error file=$f::not executable"
              missing=1
            fi
          done
          exit "$missing"

      # shellcheck + check-portability
      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test
