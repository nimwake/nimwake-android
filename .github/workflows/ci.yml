# Pull Request — lint + 기기 없는 테스트
#
# 실기기 테스트(tests/device)는 CI에 넣지 않는다. 결과는 .docs/validation/ 리포트로 남긴다. (Phase 1 D-A6)
# 스크립트는 macOS(BSD)와 WSL·Linux(GNU)에서 같은 명령으로 돌아야 하므로 두 OS에서 돌린다. (D-A7)

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install tools (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck bats-core

      - name: Versions
        run: |
          shellcheck --version | head -2
          bats --version

      # git이 실행 비트를 잃으면 기기에서 Permission denied가 난다. (validation/02 작업 중 실제로 겪었다)
      - name: Executable bits
        run: |
          missing=0
          for f in $(git ls-files '*.sh' 'host/bin/*' 'host/boot/*' 'tests/unit/fixtures/*'); do
            case "$f" in host/lib/*) continue ;; esac
            if [ ! -x "$f" ]; then
              echo "::error file=$f::not executable"
              missing=1
            fi
          done
          exit "$missing"

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test
