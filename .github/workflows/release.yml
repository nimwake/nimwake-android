# Release — 태그(v*)를 push하면 검사를 거쳐 GitHub Release를 만든다.
#
# 이 레포는 binary를 빌드하지 않는다 (Phase 1 D-A3). Release에는 Host Layer 소스 묶음과 체크섬만 올린다.
# 기기에 들어가는 Core binary는 그 묶음의 core.lock이 가리키는 Core release에서 make fetch-core가 받는다.
#
# 실기기 검증은 CI가 할 수 없다 (D-A6). 태그를 달기 전에 .docs/validation/09의 8항목을 사람이 확인한다.
# 여기서 막는 것은 기계적으로 볼 수 있는 것뿐이다: lint · unit · scripts/release-check.sh
#   (CHANGELOG에 그 버전 절이 있는가, 정식 릴리스면 core.lock이 Core 태그에 고정돼 있는가)

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  release:
    name: check + publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tools
        with:
          shellcheck-version: ${{ env.SHELLCHECK_VERSION }}

      # 테스트보다 먼저 본다. CHANGELOG를 고치지 않은 태그라면 몇 분을 쓰기 전에 멈춘다
      - name: Release check
        run: scripts/release-check.sh "$GITHUB_REF_NAME"

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Package
        run: |
          name="nimwake-android-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "${name}.tar.gz" >"${name}.tar.gz.sha256"
          scripts/release-check.sh "$GITHUB_REF_NAME" --notes >notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="nimwake-android-${GITHUB_REF_NAME}"
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $pre \
            --title "nimwake-android ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "${name}.tar.gz" "${name}.tar.gz.sha256"
