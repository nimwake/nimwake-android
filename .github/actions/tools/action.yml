name: Tools
description: bats · ShellCheck(버전 고정) · original-awk(Linux). ci.yml과 ci-macos.yml이 같이 쓴다.

inputs:
  shellcheck-version:
    description: 개발 머신 · 기기와 같은 ShellCheck 버전. 버전마다 경고가 다르다 (0.9.0만 SC2015를 냈다)
    required: true

runs:
  using: composite
  steps:
    # original-awk은 macOS awk와 같은 one-true-awk다. Linux에서도 그 방언으로 soak 요약을 돌린다.
    - name: Install bats, original-awk (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y bats original-awk

    - name: Install bats (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install bats-core

    - name: Install ShellCheck
      shell: bash
      env:
        SHELLCHECK_VERSION: ${{ inputs.shellcheck-version }}
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=linux.x86_64 ;;
          macOS-ARM64) target=darwin.aarch64 ;;
          macOS-X64) target=darwin.x86_64 ;;
          *) echo "::error::no ShellCheck build for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.${target}.tar.xz" \
          | tar -xJ -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

    - name: Versions
      shell: bash
      run: |
        shellcheck --version | head -2
        bats --version
